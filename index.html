<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Plan HGW: juega y entiende</title>
<link rel="icon" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{--d:#1F7638;--m:#518F31;--l:#81B828;--t:#3D9B63;--k:#060707;--bg:#F4FAF1;--b:#D6E8CC}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--k);font:17px/1.5 Nunito,system-ui,sans-serif}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;margin:.2em 0;color:var(--d)}
header{display:flex;align-items:center;gap:12px;padding:10px 16px;background:#fff;border-bottom:3px solid var(--l);position:sticky;top:0;z-index:5}
header img{height:42px}
#tr{flex:1;display:flex;gap:6px;align-items:center}
#tr i{flex:1;height:10px;border-radius:9px;background:var(--b)}
#tr i.d{background:var(--m)}#tr i.c{background:var(--l);animation:p 1.2s infinite}
@keyframes p{50%{transform:scaleY(1.7)}}
.hd{font-weight:800;white-space:nowrap}
main{max-width:720px;margin:0 auto;padding:18px 14px 60px}
.card{background:#fff;border:2px solid var(--b);border-radius:20px;padding:20px;margin:14px 0}
.big{font-size:56px;text-align:center}
button{font:inherit;cursor:pointer}
.bt{background:var(--d);color:#fff;border:0;border-radius:14px;padding:12px 22px;font-weight:800;box-shadow:0 4px 0 #14502a}
.bt:active{transform:translateY(3px);box-shadow:none}
.bt.g{background:#fff;color:var(--d);border:2px solid var(--d);box-shadow:none}
.row{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-top:14px;flex-wrap:wrap}
.ch{border:2px solid var(--b);background:#fff;border-radius:12px;padding:8px 12px;font-weight:700;margin:3px}
.ch.on{background:var(--l);border-color:var(--m);color:var(--k)}
.rs{background:#EEF7E8;border-left:6px solid var(--l);border-radius:10px;padding:12px;margin-top:10px}
.op{display:block;width:100%;text-align:left;border:2px solid var(--b);background:#fff;border-radius:14px;padding:12px 14px;margin:8px 0;font-weight:700}
.op:hover:not(:disabled){border-color:var(--t)}
.op.ok{background:var(--l);border-color:var(--m)}
.op.no{background:#f3dede;border-color:#c66;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.gen{display:inline-block;margin:3px;padding:6px 10px;border-radius:10px;background:var(--b);color:#789}
.gen.on{background:var(--d);color:#fff}
input[type=text]{font:inherit;padding:10px;border:2px solid var(--b);border-radius:12px;width:100%}
input[type=range]{width:100%;accent-color:var(--m)}
.dots span{display:inline-block;width:9px;height:9px;border-radius:9px;background:var(--b);margin:0 3px}
.dots span.on{background:var(--d)}
canvas{position:fixed;inset:0;pointer-events:none;z-index:9}
.cert{text-align:center;border:4px double var(--d)}
small{color:#567}
@media print{header,.row,canvas{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header><img src="logo.png" alt="HGW"><div id="tr"></div><span class="hd">⭐<span id="xp">0</span> 🔥<span id="st">0</span> <button class="ch" id="mu" onclick="mu=!mu;this.textContent=mu?'🔇':'🔊'">🔊</button></span></header>
<main id="v"></main><canvas id="cv"></canvas>
<script>
const $=s=>document.querySelector(s);
let mu=false,AC;
function tn(f,d,ty,s,v){if(mu)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+s;o.type=ty||'triangle';o.frequency.value=f;g.gain.setValueAtTime(v||.15,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d)}catch(e){}}
const ok=()=>[523,659,784].forEach((f,i)=>tn(f,.18,0,i*.08));
const bad=()=>tn(180,.3,'sawtooth',0,.07);
const fan=()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tn(f,.25,0,i*.1));
function boom(n){const c=$('#cv'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cl=['#1F7638','#518F31','#81B828','#3D9B63','#E8C547','#fff'];
const P=Array.from({length:n},()=>({x:innerWidth/2,y:innerHeight/3,vx:(Math.random()-.5)*16,vy:Math.random()*-14-2,s:4+Math.random()*7,c:cl[Math.random()*6|0]}));let f=0;
(function a(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.4;x.fillStyle=p.c;x.fillRect(p.x,p.y,p.s,p.s)});if(++f<110)requestAnimationFrame(a);else x.clearRect(0,0,c.width,c.height)})()}
const M=[['Pre-Junior',50,'🌱'],['Junior',100,'🌿'],['Senior',300,'🌳'],['Master',600,'👑']],PCT=[5,7,8,10],TOP=[50,120,360,720],DEV=[.2,.5,1.5,3];
const MN=M.map(x=>x[2]+' '+x[0]);
let w={m:0,s:0,n:0,A:20000,B:10000,e:0},cw='';
const ch=(k,a)=>'<div>'+a.map((x,i)=>`<button class="ch${w[k]==i?' on':''}" onclick="w.${k}=${i};dw()">${x}</button>`).join('')+'</div>';
const WD={
ing:()=>[ch('m',MN.map((x,i)=>x+' · '+M[i][1]+' BV')),`Compras <b>${M[w.m][1]} BV</b> → entras como <b>${M[w.m][0]}</b>.${w.m>1?' Ya puedes ganar el Bono Élite 🏆':''}`],
ini:()=>{const t=M[w.m][1]*.2;return[ch('m',M.map(x=>x[1]+' BV')),`Tu nuevo afiliado entra con <b>${M[w.m][1]} BV</b> → 20% = <b>USD ${t}</b>: <b>USD ${t/2}</b> para ti y <b>USD ${t/2}</b> para él o ella.`]},
dev:()=>{const v=DEV[Math.min(w.s,w.n)];return['<small>Patrocinador</small>'+ch('s',MN)+'<small>Nuevo afiliado</small>'+ch('n',MN),`Bono de Desarrollo: <b>USD ${v}</b> → USD ${v/2} para cada uno.`]},
eq:()=>{const b=Math.min(w.A,w.B),r=b*PCT[w.m]/100,p=Math.min(r,TOP[w.m]);return[ch('m',MN)+`<small>Lado A</small><input type=range min=0 max=20000 step=500 value=${w.A} oninput="w.A=+this.value;rs()"><small>Lado B</small><input type=range min=0 max=20000 step=500 value=${w.B} oninput="w.B=+this.value;rs()">`,`A: ${w.A} BV · B: ${w.B} BV → base (lado bajo): <b>${b} BV</b> × ${PCT[w.m]}% = USD ${r}. Tope diario USD ${TOP[w.m]} → <b>USD ${p} por día</b> (USD ${p/2} c/u).`]},
eli:()=>{const g=w.e?6:3;return[ch('e',['🌳 Senior','👑 Master']),[1,2,3,4,5,6].map(i=>`<span class="gen${i<=g?' on':''}">${i}ª gen · 4%</span>`).join('')]}};
function dw(){const[c,r]=WD[cw]();$('#w').innerHTML=c+`<div id="r" class="rs">${r}</div>`}
function rs(){$('#r').innerHTML=WD[cw]()[1]}
const L=[
{t:'Tu puerta de entrada',i:'🌱',s:[['BV: la moneda secreta','Cada producto HGW tiene un valor llamado <b>BV (Bono Valor)</b>. Con los BV se calculan todos tus bonos.'],['Tu primera compra = tu membresía','Toca cada una y mira dónde entrarías 👇','ing'],['Subir de nivel','Tienes <b>6 meses</b> para ascender acumulando BV, con compras desde <b>50 BV</b>. Para estar <b>activo</b> necesitas 10 BV al mes.']],q:['¿Qué decide tu membresía de ingreso?',['Cuántos amigos traes','Los BV de tu primera compra','El departamento donde vives'],1,'Tu primera compra, medida en BV, define tu membresía.']},
{t:'Reglas de oro',i:'🧭',s:[['Una línea, un punto','Toda la vida trabajas <b>una sola línea</b> y <b>un solo punto</b>. Nunca empiezas de cero.'],['Ganancia mutua 🤝','Cada bono se parte: <b>50% para el patrocinador y 50% para el patrocinado</b>. Ganan los dos.'],['Tus nuevos afiliados','El sistema los ubica solo, <b>al lado derecho de tu último directo</b>. Si eres Senior o Master y compras 10 BV, cobras todos los bonos sin importar rango ni estructura.']],q:['Un bono de USD 100 con ganancia mutua: ¿cuánto recibe el patrocinador?',['USD 100','USD 50','USD 30'],1,'Ganancia mutua es 50% y 50%.']},
{t:'Bono de Venta al Público',i:'🛒',s:[['Tu tienda en el bolsillo','Tienes una <b>tienda virtual</b> con tu código. Compartes tu link por WhatsApp y, si alguien compra ahí, ganas la <b>diferencia del 30%</b> entre precio público y precio distribuidor.'],['Ejemplo en Bolivia','Doña Rosa, en El Alto, comparte su link con sus vecinas. Si vende <b>Bs 1.000</b> a precio público, su diferencial ronda <b>Bs 300</b> <small>(ejemplo ilustrativo)</small>. Esos BV también cuentan para tus 10 BV del mes.']],q:['¿De dónde sale este bono?',['De la diferencia del 30% entre precio público y distribuidor','De afiliar gente','Del rango Plata'],0,'Viene de las ventas por tu link de tienda.']},
{t:'Bono de Inicio Rápido',i:'⚡',s:[['Premio por traer gente','Se reparte el <b>20% de los BV</b> de la primera compra del nuevo, hasta completar Master (600 BV). Mitad para ti, mitad para él o ella. Se paga de tu <b>1ª y 2ª generación</b>. Pruébalo 👇','ini']],q:['Alguien entra con 300 BV. ¿Cuánto se reparte en total?',['USD 30','USD 60','USD 120'],1,'20% de 300 BV = USD 60 (USD 30 y USD 30).']},
{t:'Bono de Desarrollo',i:'🌳',s:[['10 niveles hacia abajo','Ganas de la primera compra de tus directos y de la línea de tu patrocinador, <b>hasta 10 niveles</b>. El monto sale de una tabla según las membresías y se parte 50/50. Juega con ella 👇','dev']],q:['Patrocinador Master y nuevo afiliado Senior: ¿cuántos USD de Desarrollo?',['USD 0.5','USD 1.5','USD 3.0'],1,'En la tabla, Master con Senior da USD 1.5.']},
{t:'Bono de Equipo',i:'⚖️',s:[['Equilibrio premiado','Se calcula cada <b>día</b> y se paga cada <b>semana</b>. Se compara el BV de tus dos lados y se paga sobre el <b>lado más bajo</b>, con un tope diario según tu membresía. También 50/50. Mueve las barras 👇','eq']],q:['Un lado tiene 20.000 BV y el otro 10.000 BV. ¿Sobre cuánto se calcula?',['20.000 BV','10.000 BV','30.000 BV'],1,'Siempre cuenta el lado más bajo.']},
{t:'Bono Élite',i:'🏆',s:[['Solo Senior y Master','Es el <b>4% por generación</b> de lo generado en el Bono de Equipo. Senior cobra hasta la <b>3ª</b> generación y Master hasta la <b>6ª</b> 👇','eli']],q:['Eres Master. ¿Hasta qué generación cobras Élite?',['3ª','6ª','10ª'],1,'Master llega a la 6ª generación.']},
{t:'Bono de Recompra',i:'🔄',s:[['Tu consumo también paga','Reparte el <b>5% de las compras</b> de tu red hasta <b>10 niveles</b>, con ganancia mutua. Además, el 5% de tus ganancias de Inicio, Equipo, Élite y Desarrollo vuelve como saldo para comprar en tu tienda virtual.'],['La condición','Debes comprar <b>10 BV o más al mes</b> (tu compra o ventas por tu tienda). Es el <b>único bono mensual</b>; los otros cinco se pagan cada semana.']],q:['¿Cuál es el bono que se paga mensualmente?',['Equipo','Recompra','Élite'],1,'Recompra es mensual; los demás son semanales.']},
{t:'Rangos de Honor',i:'💎',s:[['Sube con tus ganancias','Ganancias acumuladas: <b>Plata US$500</b> (Bs 5.000), <b>Oro US$1.500</b> (Bs 15.000), <b>Platino US$3.000</b> (Bs 30.000), <b>Diamante US$5.000</b> (Bs 50.000). Cambio: 10 Bs = 1 USD. Cada logro trae certificado.'],['Diamantes en cadena','Cada directo que llega a Diamante te suma un Diamante, hasta <b>7 Diamantes</b>: viaje internacional para dos (5 días, 4 noches, presupuesto US$3.000).'],['Más arriba','<b>Diamante Azul</b> participa del 0,1% al 0,5% del margen neto de América y <b>Corona</b> del 0,2% al 0,5% de la facturación, cada trimestre. Premios: hasta US$30.000 para auto (US$100 mil ganados en un año) y US$80.000 para departamento (US$200 mil).']],q:['Acumulas US$3.000 en ganancias. ¿Qué rango alcanzas?',['Oro','Platino','Diamante'],1,'US$3.000 corresponde a Platino.']}];
const X=[['Carlos, de Cochabamba, entra comprando 300 BV. ¿Qué membresía tiene?',['Junior','Senior','Master'],1,'300 BV es Senior.',0],
['Rosa vende por su link de tienda. ¿Qué bono cobra?',['Venta al Público','Élite','Recompra'],0,'Es el Bono de Venta al Público.',2],
['Lucía afilia a Pedro, que entra con 600 BV. ¿Cuánto recibe Pedro del Inicio Rápido?',['USD 120','USD 60','USD 20'],1,'20% de 600 BV = USD 120; Pedro recibe la mitad, USD 60.',3],
['Juan es Junior y su nuevo afiliado es Master. ¿Qué monto de Desarrollo corresponde?',['USD 0.5','USD 1.5','USD 3.0'],0,'Con Junior en la tabla, el monto es USD 0.5.',4],
['Valeria es Junior y sus lados suman 20.000 y 10.000 BV. ¿Cuánto cobra por día en Equipo?',['USD 700','USD 120','USD 1.400'],1,'10.000 BV × 7% = USD 700, pero el tope diario de Junior es USD 120.',5],
['Marcos es Senior. ¿Hasta qué generación cobra Élite?',['3ª','6ª','Todas'],0,'Senior llega hasta la 3ª.',6],
['Ana no compró nada este mes. ¿Cobra Recompra?',['Sí, siempre','No: necesita 10 BV al mes','Sí, pero la mitad'],1,'La condición es comprar 10 BV o más al mes.',7],
['Logras 7 Diamantes. ¿Qué premio recibes?',['Auto de US$30.000','Viaje internacional para dos','US$80.000 para departamento'],1,'7 Diamantes dan el viaje internacional.',8]];
let S={n:'Líder',xp:0,st:0,max:0,res:{}},cur=0,si=0,Q={};
var CT=[];
function mkP(){return new Promise(res=>{const[nm,n,t,p,xp,dt]=CT,c=document.createElement('canvas');c.width=1200;c.height=850;const x=c.getContext('2d'),im=new Image();
const go=()=>{x.fillStyle='#F4FAF1';x.fillRect(0,0,1200,850);x.fillStyle='#fff';x.fillRect(30,30,1140,790);x.strokeStyle='#1F7638';x.lineWidth=8;x.strokeRect(30,30,1140,790);x.strokeStyle='#81B828';x.lineWidth=3;x.strokeRect(50,50,1100,750);
x.textAlign='center';if(im.width)x.drawImage(im,550,70,99,140);
x.fillStyle='#1F7638';x.font='600 54px Fredoka,Nunito,sans-serif';x.fillText('CERTIFICADO DE DOMINIO',600,270);
x.fillStyle='#518F31';x.font='700 28px Nunito,sans-serif';x.fillText('Plan de Compensación HGW',600,315);
x.fillStyle='#567';x.font='24px Nunito,sans-serif';x.fillText('Se otorga a',600,385);
let f=80;x.fillStyle='#060707';do{f-=4;x.font='600 '+f+'px Fredoka,Nunito,sans-serif'}while(x.measureText(nm).width>950&&f>24);x.fillText(nm,600,470);
x.fillStyle='#81B828';x.fillRect(300,500,600,5);
x.fillStyle='#060707';x.font='700 30px Nunito,sans-serif';x.fillText('Aprobó la prueba final: '+n+' de '+t+' ('+p+'%)',600,570);x.fillText('Puntaje total: '+xp+' XP',600,620);
x.fillStyle='#567';x.font='24px Nunito,sans-serif';x.fillText('Entendió los 6 bonos, los rangos y los premios del plan.',600,680);x.fillText(dt+' · Healthy Green World · Bolivia',600,745);
c.toBlob(res,'image/png')};im.onload=go;im.onerror=go;im.src='logo.png'})}
function cop(){const b=$('#cp'),d=m=>{b.textContent=m;ok();setTimeout(()=>{b.textContent='Copiar certificado'},2600)},dl=()=>mkP().then(bl=>{const a=document.createElement('a');a.href=URL.createObjectURL(bl);a.download='certificado-HGW.png';a.click();d('⬇️ Imagen descargada')});
if(navigator.clipboard&&window.ClipboardItem)navigator.clipboard.write([new ClipboardItem({'image/png':mkP()})]).then(()=>d('✅ ¡Copiado! Pégalo donde quieras')).catch(dl);else dl()}
function hud(){$('#xp').textContent=S.xp;$('#st').textContent=S.st;$('#tr').innerHTML=L.map((_,k)=>`<i class="${k<cur?'d':k==cur?'c':''}"></i>`).join('')+`<i class="${cur>=L.length?'c':''}"></i>`}
function V(h){$('#v').innerHTML=h;hud();scrollTo(0,0)}
function intro(){V(`<div class="card"><div class="big">🌿</div><h1 style="text-align:center">Descubre el Plan de Compensación HGW</h1><p style="text-align:center">9 niveles cortos, 6 formas de ganar y una prueba final. Juegas, entiendes y listo. Sin charla larga.</p><p>¿Cómo te llamas?</p><input type="text" id="nm" placeholder="Tu nombre"><div class="row"><span></span><button class="bt" onclick="S.n=$('#nm').value.trim()||'Líder';ok();lv()">¡Empezar!</button></div></div>`)}
function lv(){const l=L[cur],s=l.s[si],last=si==l.s.length-1;cw=s[2]||'';
V(`<small>Nivel ${cur+1} de ${L.length}</small><h2>${l.i} ${l.t}</h2><div class="card"><h3>${s[0]}</h3><p>${s[1]}</p>${cw?'<div id="w"></div>':''}</div><div class="row"><button class="bt g" onclick="${si?'si--;lv()':'intro()'}">Atrás</button><span class="dots">${l.s.map((_,k)=>`<span class="${k==si?'on':''}"></span>`).join('')}</span><button class="bt" onclick="${last?'rt()':'si++;lv()'}">${last?'¡Al reto!':'Siguiente'}</button></div>`);if(cw)dw()}
function rt(){V(`<h2>${L[cur].i} Reto del nivel</h2><div id="q"></div>`);ask(L[cur].q,1,f=>{S.res[cur]=f;S.xp+=20;fan();boom(200);S.max=Math.max(S.max,cur);
V(`<div class="card" style="text-align:center"><div class="big">${L[cur].i}</div><h2>¡Nivel ${cur+1} superado, ${S.n}!</h2><p>+20 XP de bonus. Llevas <b>${S.xp} XP</b> y ${Object.values(S.res).filter(Boolean).length} aciertos a la primera.</p><button class="bt" onclick="cur++;si=0;cur<L.length?lv():ex(0,[])">${cur<L.length-1?'Siguiente nivel':'Ir a la prueba final'}</button></div>`)})}
function ask(q,retry,cb){Q={q,retry,cb,t:0,d:0};$('#q').innerHTML=`<div class="card"><h3>${q[0]}</h3>${q[1].map((o,i)=>`<button class="op" onclick="pick(${i})">${o}</button>`).join('')}<div id="fb"></div></div>`}
function fb(h,show){$('#fb').innerHTML=`<p>${h}</p>`+(show?'<div class="row"><span></span><button class="bt" onclick="Q.cb(Q.t==0)">Continuar</button></div>':'')}
function pick(i){if(Q.d)return;const q=Q.q,b=document.querySelectorAll('.op');
if(i==q[2]){Q.d=1;b[i].classList.add('ok');ok();if(Q.t==0){S.st++;S.xp+=10+Math.min(S.st,5)*2;boom(70)}else S.xp+=3;fb('✅ '+q[3],1)}
else{Q.t++;S.st=0;bad();b[i].classList.add('no');b[i].disabled=true;if(Q.retry)fb('Casi 😉 Prueba otra opción.');else{Q.d=1;b[q[2]].classList.add('ok');fb('La correcta es la marcada. '+q[3],1)}}hud()}
function ex(n,miss){cur=L.length;if(n>=X.length)return end(miss);V(`<small>Prueba final · ${n+1} de ${X.length}</small><h2>🎯 Tu primer día como líder</h2><div id="q"></div>`);ask(X[n],0,f=>{if(!f)miss.push(X[n][4]);ex(n+1,miss)})}
function end(miss){const n=X.length-miss.length,p=Math.round(n/X.length*100),pass=p>=75;CT=[S.n,n,X.length,p,S.xp,new Date().toLocaleDateString("es-BO")];if(pass){fan();boom(250)}
V(`<div class="card ${pass?'cert':''}" style="text-align:center"><div class="big">${pass?'🏅':'💪'}</div><h2>${pass?'¡Aprobado, '+S.n+'!':'Casi lo logras, '+S.n}</h2><p>Prueba final: <b>${n} de ${X.length}</b> (${p}%) · XP total: <b>${S.xp}</b></p><p>${pass?'Entendiste el plan HGW: 6 bonos, rangos y premios. Certificado de dominio del Plan de Compensación.<br><small>'+new Date().toLocaleDateString('es-BO')+'</small>':'Repasa estos niveles y vuelve a intentarlo:'}</p>${miss.length?miss.map(k=>`<button class="ch" onclick="cur=${k};si=0;lv()">${L[k].i} ${L[k].t}</button>`).join(''):''}${pass?'<img id="pv" alt="Certificado" style="max-width:100%;border-radius:12px;margin-top:8px">':''}<div class="row"><button class="bt g" onclick="cur=0;si=0;S={n:S.n,xp:0,st:0,max:0,res:{}};intro()">Jugar de nuevo</button>${pass?'<button class="bt" id="cp" onclick="cop()">Copiar certificado</button>':'<button class="bt" onclick="ex(0,[])">Repetir prueba</button>'}</div></div>`);if(pass)mkP().then(b=>{$('#pv').src=URL.createObjectURL(b)})}
intro();
</script>

<style>
.hgw-back{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:99999;
  display:inline-flex;align-items:center;gap:8px;padding:12px 22px;border-radius:999px;white-space:nowrap;text-decoration:none;
  font:600 .9rem/1 Fredoka,Nunito,system-ui,sans-serif;letter-spacing:.06em;color:#fff;
  background:linear-gradient(135deg,#1F7638,#518F31);box-shadow:0 4px 0 #14502a,0 10px 24px -6px rgba(31,118,56,.6);
